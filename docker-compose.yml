services:
  stable:
    build: ./services/api-demo
    environment:
      BUG_PROFILE: stable
      PORT: 8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  canary:
    build: ./services/api-demo
    environment:
      BUG_PROFILE: canary
      PORT: 8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  proxy:
    # Root context so the @guardrail/contracts workspace dep resolves (ADR-0004
    # deviation: this one image builds from the repo root; Dockerfile is shared).
    build:
      context: .
      dockerfile: services/proxy/Dockerfile
    expose:
      - "8080"
    environment:
      STABLE_URL: http://stable:8000
      CANARY_URL: http://canary:8000
      PORT: 8080
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      stable:
        condition: service_healthy
      canary:
        condition: service_healthy

  traffic-runner:
    build:
      context: ./workers
      dockerfile: traffic-runner/Dockerfile
    expose:
      - "8004"
    environment:
      STABLE_URL: http://stable:8000
      CANARY_URL: http://canary:8000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      PORT: 8004
      RUN_ONCE: "false"
      RUN_ON_START: "true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      stable:
        condition: service_healthy
      canary:
        condition: service_healthy

  agent:
    build:
      context: ./workers
      dockerfile: agent/Dockerfile
    expose:
      - "8003"
    environment:
      PORT: 8003
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      PROXY_ADMIN_URL: http://proxy:8080/admin/route
      BOB_SHELL: bob-shell
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      proxy:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        # NEXT_PUBLIC_* vars are baked in at build time by Next.js — the runtime
        # environment block below has no effect on them. The browser reaches
        # Supabase directly but talks to the agent/proxy via same-origin
        # /api/* Route Handlers (Slice A), so these localhost fallbacks are only
        # for local non-compose dev. Change them for remote deployments.
        NEXT_PUBLIC_AGENT_URL: http://localhost:8003
        NEXT_PUBLIC_PROXY_URL: http://localhost:8080
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      NEXT_PUBLIC_AGENT_URL: http://localhost:8003
      NEXT_PUBLIC_PROXY_URL: http://localhost:8080
      AGENT_URL: http://agent:8003
      PROXY_BASE_URL: http://proxy:8080
      TRAFFIC_RUNNER_URL: http://traffic-runner:8004
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    depends_on:
      - proxy
      - agent
      - traffic-runner
